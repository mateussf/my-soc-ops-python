<div id="game-container">
<div class="landing-bg flex flex-col items-center justify-center min-h-full p-6">

    <!-- Decorative dot grid layer is applied via CSS background -->

    <div class="landing-card text-center">

        <!-- Badge -->
        <div class="landing-badge">
            <span class="landing-badge-dot"></span>
            LIVE EVENT
        </div>

        <!-- Title block -->
        <div class="landing-title-wrap">
            <h1 class="landing-title">SOC<br>OPS</h1>
            <div class="landing-title-stripe"></div>
        </div>

        <p class="landing-subtitle">SOCIAL BINGO</p>

        <!-- How to play -->
        <div class="landing-rules">
            <p class="landing-rules-header">HOW TO PLAY</p>
            <ol class="landing-rules-list">
                <li><span class="landing-rule-num">01</span> Find someone who matches a square</li>
                <li><span class="landing-rule-num">02</span> Tap the square to mark it</li>
                <li><span class="landing-rule-num">03</span> Get 5 in a row &mdash; you win!</li>
            </ol>
        </div>

        <!-- Start button -->
        <button
            hx-post="/start"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="landing-btn">
            Start Game
            <span class="landing-btn-arrow">→</span>
        </button>

    </div>
</div>
</div>
